<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Epochenkrieg</title>
    <meta name="description" content="Zwei-Spieler-Strategiespiel: Führe deine Armee durch sechs Zeitalter und zerstöre die gegnerische Basis." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      :root {
        color-scheme: dark;
        --ground: #05060d;
        --ink: #f4f1e8;
        height: 100%;
        box-sizing: border-box;
        background: var(--ground);
        touch-action: none;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      body {
        height: 100%;
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        outline: none;
      }
      noscript {
        color: var(--ink);
        font: 16px sans-serif;
        display: block;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game" aria-label="Epochenkrieg Spielfeld"></canvas></div>
    <noscript>Dieses Spiel benötigt JavaScript.</noscript>
    <script src="src/data.js"></script>
    <script src="src/sim.js"></script>
    <script src="src/ai.js"></script>
    <script src="src/sprites.js"></script>
    <script src="src/render.js"></script>
    <script src="src/hud.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/input.js"></script>
    <script src="src/main.js"></script>
    <!-- Schrift erst nach den Skripten laden: ein langsamer Font-Server darf den Start nicht blockieren. -->
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet" />
  </body>
</html>
